<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4f7">
  <meta name="description" content="Маленькое интерактивное приглашение">
  <title>Приглашение для тебя</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <main class="app-shell">
    <div class="topline"><span class="brand-mark">♡</span><span id="step-label">маленькое приключение</span><button id="motion-toggle" class="icon-button" type="button" aria-label="Переключить анимации" title="Переключить анимации">✦</button></div>
    <div class="progress" aria-label="Прогресс"><div id="progress-bar"></div></div>
    <section id="screen" class="screen" aria-live="polite"></section>
    <div class="footer-note" id="footer-note">сделано с теплом</div>
  </main>
  <div id="effects-layer" aria-hidden="true"></div>
  <noscript>Для работы приглашения необходимо включить JavaScript.</noscript>
</body>
</html>
